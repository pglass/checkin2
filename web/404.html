<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    color: #111;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  /* The card is one image: the QR code and the name are drawn into a single
     canvas, so a long-press save or a screenshot keeps the name with the code. */
  #out img {
    display: block;
    width: 100%;
    max-width: 512px;
    height: auto;
  }
  #msg {
    max-width: 32em;
    word-break: break-word;
  }
  #msg code {
    background: #f2f2f2;
    padding: 1px 4px;
    border-radius: 3px;
  }
  /* Stack the card and the button; the card stays the dominant element. */
  #card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 512px;
  }
  #share {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-weight: 600;
    padding: 12px 24px;
    min-height: 44px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #f7f7f7;
    color: inherit;
    cursor: pointer;
  }
  #share:active { background: #ebebeb; }
  /* currentColor so the glyph tracks the button's text color. The icons are
     hidden by default and the script adds .on to exactly one of them; the
     `hidden` attribute is not reliable here, since an inline <svg> takes its
     display from these rules rather than from the UA's [hidden] rule. */
  #share svg {
    display: none;
    width: 1.25em;
    height: 1.25em;
    fill: currentColor;
    flex: none;
  }
  #share svg.on { display: block; }
</style>
</head>
<body>
<div id="card">
  <div id="out"></div>
  <button id="share" type="button" hidden>
    <!-- Material Symbols "ios_share" and "share" (Google, Apache License 2.0),
         inlined so the button needs no network request. The platform
         conventions differ, so the script unhides whichever one matches the
         viewer's platform and leaves the other hidden. -->
    <svg id="icon-ios" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h80q17 0 28.5 11.5T360-600q0 17-11.5 28.5T320-560h-80v400h480v-400h-80q-17 0-28.5-11.5T600-600q0-17 11.5-28.5T640-640h80q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm211.5-251.5Q440-343 440-360v-407l-36 36q-12 12-28 11.5T348-732q-11-12-11.5-28t11.5-28l104-104q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l104 104q11 11 11 27.5T612-732q-12 12-28.5 12T555-732l-35-35v407q0 17-11.5 28.5T480-320q-17 0-28.5-11.5Z"/></svg>
    <svg id="icon-android" viewBox="0 -960 960 960" aria-hidden="true"><path d="M680-80q-50 0-85-35t-35-85q0-6 3-28L282-392q-16 15-37 23.5t-45 8.5q-50 0-85-35t-35-85q0-50 35-85t85-35q24 0 45 8.5t37 23.5l281-164q-2-7-2.5-13.5T560-760q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35q-24 0-45-8.5T598-672L317-508q2 7 2.5 13.5t.5 14.5q0 8-.5 14.5T317-452l281 164q16-15 37-23.5t45-8.5q50 0 85 35t35 85q0 50-35 85t-85 35Zm0-80q17 0 28.5-11.5T720-200q0-17-11.5-28.5T680-240q-17 0-28.5 11.5T640-200q0 17 11.5 28.5T680-160ZM200-440q17 0 28.5-11.5T240-480q0-17-11.5-28.5T200-520q-17 0-28.5 11.5T160-480q0 17 11.5 28.5T200-440Zm508.5-291.5Q720-743 720-760t-11.5-28.5Q697-800 680-800t-28.5 11.5Q640-777 640-760t11.5 28.5Q663-720 680-720t28.5-11.5Z"/></svg>
    <span>Share</span>
  </button>
</div>
<div id="msg" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var msg = document.getElementById('msg');
  var shareBtn = document.getElementById('share');

  // Card layout in pixels, matching the desktop app's printed card so the two
  // look like the same artifact.
  var CARD_W = 512, CARD_H = 640;
  var QR_SIDE = 480, QR_TOP = 60, NAME_GAP = 18, NAME_SIZE = 30;

  function fail(html) {
    msg.innerHTML = html;
    msg.hidden = false;
  }

  // Match /qr/<payload>, allowing a leading path prefix so this works both at a
  // domain root and on a project site (<user>.github.io/<repo>/qr/...).
  var m = location.pathname.match(/^(.*)\/qr\/([^\/?#]+)\/?$/);
  if (!m) {
    fail('Usage: <code>/qr/&lt;NameBase64&gt;</code>');
    return;
  }

  if (typeof QRCode === 'undefined') {
    fail('Could not load the QR code library.');
    return;
  }

  // Canonical URL for the QR payload: this page's own URL, minus query and hash.
  var url = location.origin + m[1] + '/qr/' + m[2];

  // Decode base64url (RFC 4648 section 5, padding optional) into a UTF-8 string.
  // atob yields one byte per char, so the bytes are re-decoded as UTF-8 to keep
  // accented names intact.
  function decodeBase64URL(s) {
    var b64 = s.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64); // throws on malformed input
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }

  // The payload is Base64URL(First + "+" + Last); "+" cannot appear in the
  // base64url alphabet, so splitting on the first one is unambiguous.
  var label = '';
  try {
    var name = decodeBase64URL(m[2]);
    var plus = name.indexOf('+');
    if (plus > 0 && plus < name.length - 1) {
      label = name.slice(plus + 1) + ', ' + name.slice(0, plus);
    }
  } catch (e) {
    // Not a decodable name: the QR code is still correct for this URL, so the
    // card is drawn without a label rather than failing outright.
    label = '';
  }

  document.title = label || url;

  // Render the QR code offscreen; qrcodejs writes into a container element.
  var stage = document.createElement('div');
  new QRCode(stage, {
    text: url,
    width: QR_SIDE,
    height: QR_SIDE,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  // qrcodejs draws to a canvas and then swaps in an <img> of it; whichever is
  // present, wait until it can be drawn from before composing the card.
  function whenReady(cb) {
    var img = stage.querySelector('img');
    var canvas = stage.querySelector('canvas');
    if (img) {
      if (img.complete && img.naturalWidth) return cb(img);
      img.onload = function () { cb(img); };
      img.onerror = function () { fail('Could not render the QR code.'); };
      return;
    }
    if (canvas) return cb(canvas);
    setTimeout(function () { whenReady(cb); }, 30);
  }

  whenReady(function (source) {
    var card = document.createElement('canvas');
    card.width = CARD_W;
    card.height = CARD_H;
    var ctx = card.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, CARD_W, CARD_H);

    // QR modules are solid blocks, so smoothing would only soften the edges a
    // scanner relies on.
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(source, (CARD_W - QR_SIDE) / 2, QR_TOP, QR_SIDE, QR_SIDE);
    ctx.imageSmoothingEnabled = true;

    if (label) {
      var size = NAME_SIZE;
      var maxWidth = CARD_W - 24;
      // Shrink an over-wide name rather than clipping it: the name is what
      // identifies the card.
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#000000';
      do {
        ctx.font = size + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        if (ctx.measureText(label).width <= maxWidth) break;
        size -= 2;
      } while (size > 10);
      ctx.fillText(label, CARD_W / 2, QR_TOP + QR_SIDE + NAME_GAP, maxWidth);
    }

    // Export as a real PNG so long-press "save image" keeps the name with the
    // code, rather than saving the bare QR.
    var png = new Image();
    png.alt = label ? ('QR code for ' + label) : ('QR code for ' + url);
    png.src = card.toDataURL('image/png');
    out.appendChild(png);

    setUpShare(card);
  });

  // The Web Share API opens the OS share sheet (iOS) or intent chooser
  // (Android), handing it the card as a PNG so it can go to Messages, the
  // photo library, AirDrop and so on. It needs a secure context, a real user
  // gesture, and file-sharing support specifically, so the button stays hidden
  // until a share of this exact file is known to be accepted.
  function setUpShare(card) {
    if (!navigator.share || !navigator.canShare || !card.toBlob) return;

    // The name rides along in the filename only. Nothing else is shared: a
    // title or text would land in the message body as pre-populated text.
    var filename = slug(label) + '.png';

    card.toBlob(function (blob) {
      if (!blob) return;

      var file;
      try {
        file = new File([blob], filename, { type: 'image/png' });
        if (!navigator.canShare({ files: [file] })) return;
      } catch (e) {
        return; // No File constructor, or this payload isn't shareable here.
      }

      // Apple's share sheet uses the box-and-up-arrow on both iOS and macOS;
      // everything else follows the Android/web three-node glyph. Touch-first
      // iPads report a Mac platform, which lands on the same icon anyway.
      var apple = /iPhone|iPad|iPod|Mac/.test(navigator.platform || '') ||
                  /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent || '');
      document.getElementById('icon-ios').classList.toggle('on', apple);
      document.getElementById('icon-android').classList.toggle('on', !apple);

      shareBtn.hidden = false;
      shareBtn.addEventListener('click', function () {
        // A rejection is usually AbortError from dismissing the sheet. No
        // retry is possible: the user gesture is spent once the promise
        // settles, so a second share() would be blocked anyway.
        navigator.share({ files: [file] }).catch(function () {});
      });
    }, 'image/png');
  }

  function slug(s) {
    return (s.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'qr-code');
  }
})();
</script>
</body>
</html>
